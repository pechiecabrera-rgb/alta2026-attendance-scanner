<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ALTA 2026 Attendance Scanner</title>


  <!-- =====================================================
       QR SCANNER LIBRARY
       ===================================================== -->

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <!-- =====================================================
       PAGE DESIGN
       ===================================================== -->

  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      font-family: Arial, sans-serif;

      background: #f4f4f4;

      text-align: center;

    }


    .container {

      max-width: 520px;

      margin: auto;

      background: white;

      padding: 20px;

      border-radius: 18px;

      box-shadow:
        0 4px 15px rgba(0,0,0,0.15);

    }


    h1 {

      margin: 5px 0;

      color: #7b1e3a;

      font-size: 26px;

    }


    h2 {

      margin: 5px 0 20px;

      color: #555;

      font-size: 17px;

      font-weight: normal;

    }


    #reader {

      width: 100%;

      margin: 15px auto;

    }


    #result {

      margin-top: 20px;

      padding: 15px;

      border-radius: 12px;

      font-size: 18px;

      font-weight: bold;

      min-height: 55px;

    }


    .waiting {

      background: #eeeeee;

      color: #555;

    }


    .success {

      background: #dff5e1;

      color: #176b2c;

    }


    .error {

      background: #ffe0e0;

      color: #a40000;

    }


    .info {

      background: #fff2cc;

      color: #765500;

    }


    /* =====================================================
       MANUAL ENTRY
       ===================================================== */

    .manual-section {

      margin-top: 25px;

      padding-top: 20px;

      border-top: 1px solid #ddd;

    }


    .manual-section h3 {

      margin: 0 0 8px;

      color: #7b1e3a;

      font-size: 19px;

    }


    .manual-section p {

      margin: 0 0 12px;

      color: #666;

      font-size: 14px;

    }


    #registrationId {

      width: 100%;

      padding: 13px;

      border: 1px solid #bbb;

      border-radius: 8px;

      font-size: 17px;

      text-align: center;

      margin-bottom: 10px;

    }


    #submitButton {

      width: 100%;

      padding: 13px;

      border: none;

      border-radius: 8px;

      background: #8b1e3f;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

    }


    #submitButton:hover {

      background: #701731;

    }


    #submitButton:disabled {

      background: #999;

      cursor: not-allowed;

    }


    .footer {

      margin-top: 20px;

      font-size: 13px;

      color: #777;

    }

  </style>

</head>


<body>


<div class="container">


  <!-- =====================================================
       HEADER
       ===================================================== -->

  <h1>ALTA 2026</h1>

  <h2>Attendance Scanner</h2>


  <!-- =====================================================
       QR CAMERA SCANNER
       ===================================================== -->

  <div id="reader"></div>


  <!-- =====================================================
       RESULT
       ===================================================== -->

  <div
    id="result"
    class="waiting"
  >

    Please scan the participant's QR Code.

  </div>


  <!-- =====================================================
       MANUAL ATTENDANCE ENTRY
       ===================================================== -->

  <div class="manual-section">

    <h3>
      Manual Attendance Entry
    </h3>


    <p>
      If the QR Code cannot be scanned,
      enter the ALTA Registration ID below.
    </p>


    <input
      type="text"
      id="registrationId"
      placeholder="Example: ALTA26-0001"
      autocomplete="off"
    >


    <button
      id="submitButton"
      onclick="submitManualAttendance()"
    >

      Submit Attendance

    </button>

  </div>


  <!-- =====================================================
       FOOTER
       ===================================================== -->

  <div class="footer">

    ZAMPENSU-ALTA Regional Fusion<br>

    Wellness Program &amp; General Assembly

  </div>


</div>


<script>


  /* =========================================================
     ALTA 2026 ATTENDANCE SCANNER
     =========================================================

     QR CODE / MANUAL ENTRY
              ↓
     GitHub Pages Scanner
              ↓
     JSONP
              ↓
     Google Apps Script Web App
              ↓
     processQRScan()
              ↓
     Attendance Sheet

     ========================================================= */


  /* =========================================================
     GOOGLE APPS SCRIPT WEB APP URL
     ========================================================= */

  const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbwJVtUazqNKH9VA5rogtujNYrLcaqQpHX5mR_0GQYz7FTpGcNJsiC90aRVw66vSdlrj/exec";


  /* =========================================================
     PROCESSING CONTROL
     ========================================================= */

  let isProcessing = false;


  /* =========================================================
     SHOW RESULT
     ========================================================= */

  function showResult(message, type) {

    const result =
      document.getElementById("result");

    result.className = type;

    result.innerHTML = message;

  }


  /* =========================================================
     SEND QR / REGISTRATION ID TO APPS SCRIPT
     
     IMPORTANT:
     We use JSONP instead of fetch().
     
     This avoids the CORS problem between:
     
     GitHub Pages
             and
     Google Apps Script
     
     ========================================================= */

  function sendAttendance(registrationId) {


    if (isProcessing) {

      return;

    }


    registrationId =
      registrationId.trim();


    if (!registrationId) {

      showResult(

        "⚠️ Please enter an ALTA Registration ID.",

        "error"

      );

      return;

    }


    isProcessing = true;


    showResult(

      "⏳ Processing attendance...<br>" +
      "Registration ID: " +
      registrationId,

      "info"

    );


    /* -------------------------------------------------------
       Create a unique JSONP callback name
       ------------------------------------------------------- */

    const callbackName =
      "altaAttendanceCallback_" +
      Date.now();


    /* -------------------------------------------------------
       Create global callback function
       ------------------------------------------------------- */

    window[callbackName] =
      function(result) {


        console.log(
          "Apps Script response:",
          result
        );


        /* -----------------------------------------------
           SUCCESS
           ----------------------------------------------- */

        if (result && result.success) {

          showResult(

            "✅ " +
            (
              result.message ||
              "Attendance recorded successfully."
            ),

            "success"

          );

        }


        /* -----------------------------------------------
           ERROR / NOT SUCCESSFUL
           ----------------------------------------------- */

        else {

          showResult(

            "⚠️ " +
            (
              result && result.message
                ? result.message
                : "Attendance could not be recorded."
            ),

            "error"

          );

        }


        /* -----------------------------------------------
           Remove JSONP script
           ----------------------------------------------- */

        if (script.parentNode) {

          script.parentNode.removeChild(script);

        }


        /* -----------------------------------------------
           Remove callback
           ----------------------------------------------- */

        delete window[callbackName];


        /* -----------------------------------------------
           Allow next scan
           ----------------------------------------------- */

        setTimeout(

          function() {

            isProcessing = false;

            showResult(

              "Please scan the next participant's QR Code.",

              "waiting"

            );

          },

          2500

        );

      };


    /* =====================================================
       CREATE JSONP SCRIPT REQUEST
       ===================================================== */

    const script =
      document.createElement("script");


    script.src =
      SCRIPT_URL +
      "?api=scan" +
      "&qr=" +
      encodeURIComponent(registrationId) +
      "&callback=" +
      encodeURIComponent(callbackName);


    /* =====================================================
       CONNECTION ERROR
       ===================================================== */

    script.onerror =
      function() {


        console.error(
          "Unable to contact Apps Script."
        );


        showResult(

          "❌ Connection error.<br>" +
          "Unable to contact the ALTA 2026 server.",

          "error"

        );


        if (script.parentNode) {

          script.parentNode.removeChild(script);

        }


        delete window[callbackName];


        isProcessing = false;

      };


    /* =====================================================
       SEND REQUEST
       ===================================================== */

    document.body.appendChild(script);

  }


  /* =========================================================
     QR SCANNER SUCCESS
     ========================================================= */

  function scanSuccess(decodedText) {


    if (isProcessing) {

      return;

    }


    const qrValue =
      decodedText.trim();


    if (!qrValue) {

      return;

    }


    console.log(
      "QR Code detected:",
      qrValue
    );


    sendAttendance(qrValue);

  }


  /* =========================================================
     QR SCANNER ERROR
     
     Normal camera scanning errors are ignored.
     ========================================================= */

  function scanError(errorMessage) {

    // Normal scanning errors are ignored.

  }


  /* =========================================================
     MANUAL ATTENDANCE
     ========================================================= */

  function submitManualAttendance() {


    if (isProcessing) {

      return;

    }


    const input =
      document.getElementById(
        "registrationId"
      );


    const registrationId =
      input.value.trim();


    if (!registrationId) {

      showResult(

        "⚠️ Please enter an ALTA Registration ID.",

        "error"

      );

      input.focus();

      return;

    }


    sendAttendance(registrationId);

  }


  /* =========================================================
     ENTER KEY SUPPORT
     ========================================================= */

  document
    .getElementById("registrationId")
    .addEventListener(

      "keydown",

      function(event) {


        if (event.key === "Enter") {

          event.preventDefault();

          submitManualAttendance();

        }

      }

    );


  /* =========================================================
     START QR SCANNER
     ========================================================= */

  const scanner =
    new Html5QrcodeScanner(

      "reader",

      {

        fps: 10,

        qrbox: {

          width: 250,

          height: 250

        },

        rememberLastUsedCamera: true

      },

      false

    );


  /* =========================================================
     RENDER SCANNER
     ========================================================= */

  scanner.render(

    scanSuccess,

    scanError

  );


</script>


</body>

</html>
